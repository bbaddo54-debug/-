<p class='cp'>▲ 야간 시간대 도심 골목. 기사 내용과 직접 관련 없는 자료 사진입니다.</p>
<p>최근 서울 일대에서 ‘뱀파이어로 추정되는 흔적’이 잇따라 발견돼 경찰과 보건당국이 합동 조사에 나섰다.</p>
<p>25일 나이트라인뉴스가 경찰과 관할 보건소 등을 취재한 결과, 지난달 25일부터 이날까지 접수된 유사 신고는 모두 17건으로 집계됐다. 신고 대부분은 오후 10시부터 새벽 4시 사이 대학가와 주택가 골목에서 발생했다.</p>
<p>신고자들은 공통적으로 “낯선 이의 접근을 받은 뒤 기억이 끊겼다”, “목 부위에 작은 상처 두 개가 남아 있었다”고 진술한 것으로 알려졌다. 일부는 상대방의 손이 “얼음처럼 차가웠다”고 말했다.</p>
<p>현장에서는 동물 사체에서 혈액이 거의 빠져나간 채 발견된 사례도 확인됐다. 경찰은 “동물학대 가능성을 포함해 모든 가능성을 열어 두고 수사 중”이라고 밝혔다.</p>
<p>주민들 사이에서는 “낮에는 한 번도 마주친 적 없는 사람이 밤마다 나타난다”는 제보도 이어지고 있다. 한 대학가 상인은 “해가 드는 시간에는 그 얼굴을 본 적이 없다는 말이 돈다”고 전했다.</p>
<h3>전문가 “신화 아닌 ‘현상’으로 접근해야”</h3>
<p>정하윤 문화인류학 교수는 “뱀파이어는 오랫동안 민담 속 존재로 여겨졌지만, 비슷한 증상을 호소하는 사례가 반복되는 만큼 사실관계 확인이 필요하다”며 “가해자가 호의적이고 매력적인 모습으로 접근한다는 증언이 많다는 점이 특히 우려스럽다”고 말했다.</p>
<p>그는 이어 “피해자들은 처음에 위험을 전혀 감지하지 못했다고 말한다”며 “오히려 상대가 다정하고 사려 깊었다고 기억한다”고 설명했다.</p>
<p>경찰은 현재 CCTV 분석을 진행 중이나, 일부 영상에서는 인물이 식별되지 않거나 화면이 심하게 흔들리는 현상이 확인된 것으로 전해졌다.</p>
<h3>시민 행동 요령</h3>
<p>당국은 ▲야간에 혼자 낯선 사람과 만나지 않기 ▲약속 장소와 시간을 가족·지인에게 공유하기 ▲상대의 신원을 확인하기 전에는 차량 탑승이나 집 앞 동행을 피하기 ▲목 부위 상처나 기억 단절이 있으면 즉시 112 또는 보건소에 신고하기 등을 당부했다.</p>
